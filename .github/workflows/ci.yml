name: Tests and security checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      AUDIT_SECRET_KEY: ci-only-random-placeholder-for-tests-do-not-reuse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test extras
        run: python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q agents growth_chart.py cli.py enrichment.py simulator.py
      - name: Test suite
        run: python -m pytest -q
      - name: Browser JavaScript syntax check
        run: node --check web/app.js
      - name: Security regression
        run: |
          python - <<'PY'
          from agents.base import AuditTrail
          log = AuditTrail(secret_key="ci-regression-key")
          log.log("test", "ci", "event", {"status": "OK"})
          assert log.verify_integrity()
          log.logs[0]["event_type"] = "forged"
          assert not log.verify_integrity(), "Modified record must fail HMAC verification"
          PY
