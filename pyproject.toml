[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "who-growth-chart-analyzer"
version = "3.1.0"
description = "WHO 2006 age-based LMS anthropometry, CLI, and FastAPI endpoints"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Dr. Abu Suraih Sakhri"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps",
]
dependencies = [
    "fastapi>=0.111,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10", "httpx>=0.27,<1"]

[project.scripts]
who-growth-chart-analyzer = "cli:main"
who-growth-standards = "growth_chart:main"

[tool.setuptools]
py-modules = ["cli", "growth_chart", "enrichment", "simulator"]

[tool.setuptools.packages.find]
include = ["agents*"]

[tool.setuptools.package-data]
agents = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "."]
python_files = ["test_*.py"]
